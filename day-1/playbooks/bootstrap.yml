- hosts: controlplane
  gather_facts: no
  become: false
  run_once: true
  tasks:
  - name: Bootstrap | Set facts
    set_fact:
      talosctl_opts: --nodes {{ ansible_host | default(inventory_hostname) }} --endpoints {{ ansible_host | default(inventory_hostname) }} --talosconfig={{ inventory_dir }}/talosconfig

  - name: Bootstrap | Bootstrap talos controlplane (bootstrap of one etcd instance)
    until: bootstrap is success
    delay: 30
    retries: 30
    register: bootstrap
    delegate_to: localhost
    ansible.builtin.command: talosctl {{ talosctl_opts }} bootstrap
    environment:
      no_proxy: "{{ ansible_host | default(inventory_hostname) }}"
    failed_when:
    - bootstrap.rc == 1
    - bootstrap.stderr_lines[1] | regex_search("AlreadyExists") == ""
    changed_when:
    - bootstrap.rc == 0
    - bootstrap.stderr_lines[1] | regex_search("AlreadyExists") == ""

  # Only wait for full-cluster health after an actual fresh bootstrap. On an
  # already-deployed cluster (bootstrap returns AlreadyExists -> not changed)
  # this would hang forever waiting on the very nodes we're about to repair in
  # the add-nodes step, so skip it and let the repair proceed.
  - name: Bootstrap | Wait for the node to be ready
    when: bootstrap.changed
    until: health is success
    delay: 30
    retries: 30
    register: health
    delegate_to: localhost
    changed_when: false
    ansible.builtin.command: talosctl {{ talosctl_opts }} health
    environment:
      no_proxy: "{{ ansible_host | default(inventory_hostname) }}"

  - name: Bootstrap | Get kubernetes configuration
    when: bootstrap.changed
    delegate_to: localhost
    ansible.builtin.command: talosctl {{ talosctl_opts }} kubeconfig
    environment:
      no_proxy: "{{ ansible_host | default(inventory_hostname) }}"

  - name: Bootstrap | Test if we are using a VIP for the controlplane
    when:
    - talos_api_endpoint is defined
    - talos_api_endpoint.address is defined
    - talos_api_endpoint.address | length > 0
    - talos_api_endpoint.port is defined
    - talos_api_endpoint.port | length > 0
    block:
    - name: Bootstrap | Set facts
      set_fact:
        vip_endpoint: "https://{{ talos_api_endpoint.address }}:{{ talos_api_endpoint.port }}"
        node_endpoint: "https://{{ ansible_host | default(inventory_hostname)}}:6443"

    - name: Bootstrap | Test if we are using a VIP for the controlplane
      delegate_to: localhost
      ansible.builtin.uri:
        # 401 or 403: both prove a kubernetes API server answered on the VIP,
        # which is all this probe establishes. Newer clusters disable anonymous
        # auth, so an unauthenticated request is rejected at authentication
        # (401) rather than authorization (403) -- .21 answers 401 directly too,
        # so it is the API version, not the VIP.
        url: "{{ vip_endpoint }}"
        status_code: [401, 403]
        use_proxy: false
        validate_certs: false

    # replace, not `sed -i`: this is delegated to the control machine, and BSD
    # sed (macOS) reads the argument after -i as a backup suffix, so the shell
    # form fails there. The module is also idempotent and reports changed
    # honestly, which the command form could not.
    - name: Bootstrap | Update the kubectl context
      delegate_to: localhost
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        regexp: "{{ node_endpoint | regex_escape }}"
        replace: "{{ vip_endpoint }}"
