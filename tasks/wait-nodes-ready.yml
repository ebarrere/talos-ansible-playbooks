# Authoritative post-change gate: block until every k8s node is Ready. Used
# between control-plane patches so we never touch the next node until the last
# one's apiserver has settled. --request-timeout bounds each attempt so a briefly
# unreachable API fails fast and the until-loop retries rather than hanging.
- name: VIP gate | all k8s nodes Ready
  ansible.builtin.command: kubectl get nodes --no-headers --request-timeout=15s
  delegate_to: localhost
  become: false
  changed_when: false
  register: vip_gate_nodes
  until: vip_gate_nodes.rc == 0 and (vip_gate_nodes.stdout_lines | select('search', ' NotReady') | list | length) == 0
  retries: "{{ vip_gate_retries | default(30) }}"
  delay: "{{ vip_gate_delay | default(10) }}"
